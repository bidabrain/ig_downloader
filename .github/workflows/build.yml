name: Build & Release APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Sign with the same debug key every time so new releases install over old ones.
      # app/build.gradle picks the keystore up from DEBUG_KEYSTORE_PATH.
      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is not set; refusing to release an APK signed with a random key."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: 60959ad9bb344ee2e133fe1280508b05c515f932ff66af13e53864a3cd1e98d9
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "APK signing cert SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected key (expected $EXPECTED_CERT_SHA256)."
            exit 1
          fi

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | awk -F'"' '{print $2}')
          echo "name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: Release ${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
